<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Warriors - Classic Arcade Fighting Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <div class="game-info">
            PIXEL WARRIORS - ARCADE FIGHTER
        </div>
        <canvas id="gameCanvas"></canvas>
        <button id="fullscreenBtn" class="fullscreen-btn" title="Tela Cheia (F11)">
            📺 F11
        </button>
        <div class="controls">
            🥊 P1: Arrow Keys + Z/X/C/V | 🥊 P2: WASD + F/G/H/T<br>
            ⚔️ Punch, Kick, Block, Special | 🏆 Best of 3 Rounds | ⏱️ 99 Second Timer<br>
            🎮 Classic 16-bit Arcade Fighting | 🔄 R: Restart | ⏸️ P: Pause
        </div>
    </div>
    
    <!-- Mobile Touch Controls for Fighting Game -->
    <div id="mobileControls" class="mobile-controls">
        <!-- Movement Controls (Left) -->
        <div class="controls-left">
            <div class="dpad">
                <div class="dpad-button dpad-up" data-key="ArrowUp">↑</div>
                <div class="dpad-button dpad-down" data-key="ArrowDown">↓</div>
                <div class="dpad-button dpad-left" data-key="ArrowLeft">←</div>
                <div class="dpad-button dpad-right" data-key="ArrowRight">→</div>
                <div class="dpad-center"></div>
            </div>
        </div>

        <!-- System Controls (Center) -->
        <div class="controls-center">
            <div class="system-buttons">
                <div class="system-button" data-key="KeyP" title="Pause">PAUSE</div>
                <div class="system-button" data-key="KeyR" title="Restart">RESTART</div>
            </div>
        </div>
        
        <!-- Fighting Controls (Right) -->
        <div class="controls-right">
            <div class="action-buttons">
                <div class="action-button punch" data-key="KeyZ" title="Punch">
                    👊
                </div>
                <div class="action-button kick" data-key="KeyX" title="Kick">
                    🦵
                </div>
                <div class="action-button block" data-key="KeyC" title="Block">
                    🛡️
                </div>
                <div class="action-button special" data-key="KeyV" title="Special">
                    ⚡
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
